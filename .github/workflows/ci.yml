name: Test pathogen-embed installation and interface

on:
  push:
    paths-ignore:
      - '*.md'
      - '*.yml'

  # Routinely check that tests pass with new versions of dependencies.
  schedule:
    # Every day at 17:30 UTC / 9:30 Seattle (winter) / 10:30 Seattle (summer)
    - cron: "30 17 * * *"

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install
      run: |
        python -m pip install --upgrade pip
        python -m pip install .[dev]
    - name: Test with cram
      run: |
        cram --shell=/bin/bash tests/
